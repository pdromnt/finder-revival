# Finder Revival home prototype: selected print-dock layout
font	/run/revival-ui/AtkinsonHyperlegible-Regular.ttf
font	/run/revival-ui/AtkinsonHyperlegible-Bold.ttf
style	MainWindow	QWidget#MainWindow{background-color:#101820;background-image:none;}
geometry	showPreheat	16	64	218	98
toolstyle	showPreheat	2
iconsize	showPreheat	48	48
text	showPreheat	Preheat
style	showPreheat	QToolButton{background-color:#1d2c39;color:#f5f8fa;border:1px solid #3e5769;border-radius:12px;padding:10px;font-family:"Atkinson Hyperlegible";font-size:24px;} QToolButton:pressed{background-color:#30485b;border-color:#7292a9;} QToolButton:disabled{background-color:#1d2c39;color:#9bb0be;border-color:#3e5769;}
geometry	showTools	246	64	218	98
toolstyle	showTools	2
iconsize	showTools	48	48
text	showTools	Tools
style	showTools	QToolButton{background-color:#1d2c39;color:#f5f8fa;border:1px solid #3e5769;border-radius:12px;padding:10px;font-family:"Atkinson Hyperlegible";font-size:24px;} QToolButton:pressed{background-color:#30485b;border-color:#7292a9;} QToolButton:disabled{background-color:#1d2c39;color:#9bb0be;border-color:#3e5769;}
geometry	showBuild	16	174	448	130
toolstyle	showBuild	2
iconsize	showBuild	48	48
text	showBuild	Print files
style	showBuild	QToolButton{background-color:#007bb5;color:#f5f8fa;border:1px solid #007bb5;border-radius:12px;padding:10px;font-family:"Atkinson Hyperlegible";font-size:24px;} QToolButton:pressed{background-color:#006a9e;border-color:#006a9e;} QToolButton:disabled{background-color:#1d2c39;color:#9bb0be;border-color:#3e5769;}
label	revival_brand
geometry	revival_brand	16	0	100	48
text	revival_brand	FINDER
style	revival_brand	QLabel{color:#f5f8fa;background:transparent;font-family:"Atkinson Hyperlegible";font-size:24px;font-weight:700;}
label	revival_subtitle
geometry	revival_subtitle	102	19	216	20
# Reuse the bootscreen lettering with the owner's compact, baseline-aligned mock proportions.
pixmap-region	revival_subtitle	/run/revival-ui/bootscreen.png	112	216	256	24	216	20
style	revival_subtitle	QLabel{background:transparent;border:none;}
label	revival_rule
geometry	revival_rule	0	47	480	1
style	revival_rule	QLabel{background-color:#2a3e4c;}
